---
major_changes:
  - sap_vm_provision - Add Apache CloudStack platform ``cloudstack_vm`` (``sap_vm_provision_iac_type`` ``ansible``) using the ngine_io.cloudstack collection, with any hypervisor and Primary Storage, and High Availability fencing methods ``sbd_devices``, ``sbd_linstor_kvm`` and ``none``.
minor_changes:
  - sap_vm_provision - New variable ``sap_vm_provision_resource_tags`` to add tags to the provisioned VMs and their resources on AWS, MS Azure, Apache CloudStack and Google Cloud (labels, converted to the allowed characters): AWS EBS volumes, network interfaces and placement groups; MS Azure OS and data disks, SBD shared disks, network interfaces, load balancers and availability sets; Google Cloud data disks; Apache CloudStack root and data volumes.
  - sap_vm_provision - AWS - New variable ``sap_vm_provision_aws_ha_iam_manage`` (default ``true``). Set to ``false`` to use an existing IAM Role and Instance Profile for HA without IAM permissions to create them (``iam:PassRole`` is still required).
  - sap_vm_provision - MS Azure - Add fencing method ``sbd_shared_disk`` (``sap_vm_provision_msazure_ha_fencing_method``) using an Azure shared disk, no IAM role assignment required. Default remains ``fence_azure_arm``.
  - sap_vm_provision - Configure ``/etc/sysconfig/proxy`` on SUSE hosts when ``sap_vm_provision_proxy_web_forward_proxy_ip`` is set, so zypper uses the proxy.
  - sap_vm_provision - MS Azure - Apply web forward proxy settings and re-register SUSE PAYG images without repositories through the proxy.
bugfixes:
  - sap_vm_provision - Disable the SUSE PAYG license watcher (``sap_vm_provision_suse_payg_disable_license_watcher``), which removed the registration and all repositories after a transient network error during its PAYG/BYOS check (e.g. when the HA Virtual IP is added).
  - sap_vm_provision - Re-register SUSE Pay-As-You-Go images (MS Azure, Google Cloud) when the first-boot registration left no repositories or invalid credentials (``common/register_suse_payg.yml``).
  - sap_vm_provision - MS Azure - Fix Availability Set lookup, which failed when ``sap_vm_provision_msazure_placement_strategy_spread`` is false (default) and when it is true.
  - sap_vm_provision - MS Azure - Use ``sap_vm_provision_msazure_resource_group_name`` when ``sap_vm_provision_msazure_private_dns_resource_group_name`` is an empty string.
  - sap_vm_provision - Use ``update-ca-certificates`` for SUSE RMT CA files (``update-ca-trust`` is not available on SLES and the command module does not support ``&&``).
  - sap_vm_provision - Proxy setup for RHEL targets failed on platforms other than IBM Power Virtual Server.
